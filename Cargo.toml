[workspace]
resolver = "2"

members = [
    "app",
    "crates/common",
    "crates/audio-engine",
    "crates/dsp"
]

[workspace.package]
edition = "2024"
version = "0.1.0"
authors = ["tojo"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
crossbeam-queue = "0.3"
